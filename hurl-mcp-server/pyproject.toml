[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hurl-mcp-server"
version = "0.1.0"
description = "MCP Server for Hurl CLI - HTTP request runner and tester"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Hurl MCP Server", email = "contact@example.com"}
]
dependencies = [
    "mcp[cli]>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
hurl-mcp = "hurl_mcp.server:main"

[tool.setuptools.packages.find]
include = ["hurl_mcp*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]