[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskfile-mcp"
version = "0.1.0"
description = "MCP Server for Taskfile development with Task CLI backend"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Taskfile MCP Contributors", email = "contact@example.com"}
]
keywords = ["mcp", "taskfile", "task", "automation", "build-tool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
taskfile-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]