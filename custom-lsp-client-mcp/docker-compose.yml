version: '3.8'

services:
  multilspy-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: multilspy-mcp-server:latest
    container_name: multilspy-mcp
    
    environment:
      # Workspace configuration
      - WORKSPACE_ROOT=/workspace
      - MCP_LSP_CACHE_DIR=/cache
      
      # Logging configuration
      - LOG_LEVEL=INFO
      
      # Python environment
      - PYTHONUNBUFFERED=1
      
    volumes:
      # Mount your project directory as workspace
      - ./workspace:/workspace:ro
      
      # Persistent cache directory
      - lsp-cache:/cache
      
      # Optional: Mount additional configuration
      # - ./config:/app/config:ro
      
    ports:
      # MCP server port (if needed)
      - "3333:3333"
      
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Networking
    networks:
      - mcp-network
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import server; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add a separate service for testing
  multilspy-mcp-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: multilspy-mcp-test:latest
    container_name: multilspy-mcp-test
    
    environment:
      - WORKSPACE_ROOT=/workspace
      - MCP_LSP_CACHE_DIR=/cache
      - PYTEST_ARGS=--verbose --cov
      
    volumes:
      - ./workspace:/workspace:ro
      - ./tests:/app/tests:ro
      - test-results:/app/test-results
      
    command: ["pytest", "tests/"]
    
    networks:
      - mcp-network
    
    profiles:
      - test

networks:
  mcp-network:
    driver: bridge

volumes:
  lsp-cache:
    driver: local
  test-results:
    driver: local