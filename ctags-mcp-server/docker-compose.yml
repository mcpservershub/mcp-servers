version: '3.8'

services:
  ctags-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: universal-ctags-mcp-server:latest
    container_name: ctags-mcp-server
    
    # Port mapping (if needed for debugging)
    ports:
      - "3000:3000"
    
    # Environment variables
    environment:
      - CTAGS_BINARY=/usr/local/bin/ctags
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    
    # Volume mounts
    volumes:
      # Mount workspace directory (read-only by default for safety)
      - ${WORKSPACE_PATH:-./}:/workspace:ro
      # Mount for tags cache (persistent)
      - tags-cache:/var/cache/ctags
      # Optional: Mount custom config
      # - ./config:/app/config:ro
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Restart policy
    restart: unless-stopped
    
    # Network
    networks:
      - mcp-network
    
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false  # Set to true for additional security if write not needed
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add a test service for development
  ctags-mcp-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Use builder stage for testing
    image: universal-ctags-mcp-server:test
    container_name: ctags-mcp-test
    command: ["python", "-m", "pytest", "tests/"]
    volumes:
      - ./:/app
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/app/src
    networks:
      - mcp-network
    profiles:
      - test  # Only run when explicitly requested

# Volumes
volumes:
  tags-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TAGS_CACHE_PATH:-./cache}

# Networks
networks:
  mcp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24