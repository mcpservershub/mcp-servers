[project]
name = "cosign-mcp"
version = "0.1.0"
description = "MCP Server for interacting with Cosign CLI tool"
authors = [
    { name = "IntelOps", email = "ksantosh@intelops.dev" }
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "mcp==1.12.2",
]

[project.scripts]
cosign-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
python-downloads = "automatic"
python-preference = "only-managed"

[tool.uv.pip]
python-version = "3.12"
