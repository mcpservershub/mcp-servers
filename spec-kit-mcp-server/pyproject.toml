[project]
name = "spec-kit-mcp"
version = "0.1.0"
description = "MCP Server for spec-kit - Spec-Driven Development workflows"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Spec-Kit MCP Team", email = "spec-kit-mcp@example.com"}
]
license = {text = "MIT"}
keywords = ["mcp", "spec-kit", "sdd", "specification", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.9.0",
    "GitPython>=3.1.43",
    "Jinja2>=3.1.4",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "coverage>=7.6.0",
]

[project.scripts]
spec-kit-mcp = "spec_kit_mcp.__main__:main"

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["E501", "B008", "B905"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/spec_kit_mcp"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]