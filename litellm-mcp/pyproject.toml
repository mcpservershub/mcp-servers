[project]
name = "litellm-mcp-server"
version = "0.1.0"
description = "MCP Server for LiteLLM - Unified interface for 100+ LLM providers"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "LiteLLM MCP Server", email = "contact@example.com"}
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "litellm>=1.57.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "asyncio>=3.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_mcp"]