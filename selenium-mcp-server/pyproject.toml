[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selenium-mcp-server"
version = "1.0.0"
description = "Advanced Selenium WebDriver MCP Server with comprehensive browser automation tools"
authors = [
    {name = "Assistant", email = "assistant@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
keywords = ["selenium", "webdriver", "mcp", "browser", "automation", "testing"]

dependencies = [
    "mcp[cli]>=1.7.0",
    "selenium>=4.27.0",
    "webdriver-manager>=4.0.2",
    "pydantic>=2.10.0",
    "pillow>=11.0.0",
    "requests>=2.32.0",
    "aiofiles>=24.1.0",
    "asyncio-throttle>=1.0.2",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
]

[project.scripts]
selenium-mcp = "selenium_mcp.server:main"

[project.urls]
Homepage = "https://github.com/your-org/selenium-mcp-server"
Repository = "https://github.com/your-org/selenium-mcp-server"
Issues = "https://github.com/your-org/selenium-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/selenium_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
asyncio_mode = "auto"