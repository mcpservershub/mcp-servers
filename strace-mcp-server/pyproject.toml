[project]
name = "strace-mcp-server"
version = "0.1.0"
description = "MCP Server for strace system call tracing"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.3.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
strace-mcp = "strace_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strace_mcp"]

[tool.mcp]
start = "strace_mcp.server:main"