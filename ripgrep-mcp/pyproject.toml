[project]
name = "ripgrep-mcp"
version = "0.1.0"
description = "MCP Server for ripgrep - powerful text search capabilities via Model Context Protocol"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "capten.ai", email = "contact@capten.ai"}
]
license = {text = "MIT"}
keywords = ["mcp", "ripgrep", "search", "grep", "text-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp[cli]>=1.3.0",
    "pydantic>=2.10.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[project.scripts]
ripgrep-mcp = "ripgrep_mcp:main"
rg-mcp = "ripgrep_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -v --cov=ripgrep_mcp --cov-report=term-missing"

[tool.coverage.run]
source = ["ripgrep_mcp"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/ripgrep_mcp"]
