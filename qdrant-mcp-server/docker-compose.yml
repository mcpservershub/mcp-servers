version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-local
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
      - ./qdrant_snapshots:/qdrant/snapshots
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - qdrant-network

  qdrant-dashboard:
    image: qdrant/qdrant:latest
    container_name: qdrant-dashboard
    entrypoint: ["/bin/bash", "-c", "sleep infinity"]
    ports:
      - "6335:6333"
    environment:
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    networks:
      - qdrant-network
    profiles:
      - dashboard

networks:
  qdrant-network:
    driver: bridge