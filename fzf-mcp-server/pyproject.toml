[project]
name = "fzf-mcp-server"
version = "0.1.0"
description = "MCP Server for fzf - A command-line fuzzy finder"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "fzf-mcp-server contributors" }
]
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fzf_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 30

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
]
